[platformio]
default_envs = hid

[env]
platform = espressif32 @ 7.1.3
framework = espidf
board = dongles3
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
debug_tool = esp-builtin

; Debugging only: the built-in USB port carries the console and JTAG, so no keyboard, FIDO or
; smartcard reaches the host.
[env:jtag]

[env:hid]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.hid.defaults

; Accepts only updates signed with the key that signed it, and aborts at startup if unsigned.
; Built unsigned; signed with tools/sign_release.sh.
[env:release]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.hid.defaults;sdkconfig.release.defaults
