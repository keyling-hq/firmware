; ESP-IDF via the official PlatformIO espressif32 platform.

[platformio]
default_envs = dev

[env]
platform = espressif32 @ 7.1.3        ; ships ESP-IDF v6.1
framework = espidf
board = dongles3                      ; boards/dongles3.json (from the LilyGo SDK)
board_build.partitions = partitions.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
debug_tool = esp-builtin              ; only while USB-Serial-JTAG owns the USB port

; Development build: console + JTAG on the built-in USB-Serial-JTAG.
; No TinyUSB, so HID output will be logged instead of sent.
[env:dev]

; [env:hid] (TinyUSB composite HID + CDC) gets added with the usb_hid component.
