// Phone <-> dongle protocol.
//
// Transport: the "bridge" GATT service. The phone writes to CMD, the dongle notifies on EVT.
// Both directions are byte streams of frames: [length: u16 little endian][protobuf payload].
// A frame may span several writes/notifications and one write may hold several frames.
//
// Flow control: the phone may only write as many CMD bytes (length prefix included) as the
// dongle has granted through Credits events. Credits with reset=true replace the phone's
// balance instead of adding to it; the dongle sends one when a session starts and after an abort.
//
// Abort: writing any byte to the CTRL characteristic stops typing and discards every CMD byte
// the dongle has not processed yet. The phone's balance is zero until the following reset;
// credit increments that arrive in between were sent before the abort and must be ignored.
// Requests waiting for an Ack when the phone aborts may never get one.
//
// Disconnect: everything the dongle accepted is still typed, unacknowledged. A new session
// starts with empty streams.

// Versioning: fields are only ever added. A dongle answers requests it doesn't know with
// RESULT_INVALID, and Hello.capabilities tells the phone what it can use before trying.
//
// oneof field numbers are grouped so families can grow independently:
//    1-9   core (session, credits, acks)
//   10-29  input to the host
//   30-49  system (config, device, firmware update)
//   50+    on-device apps

syntax = "proto3";

package bridge;

message Request {
    // Echoed in the Ack for this request. 0 means no Ack is wanted.
    uint32 id = 1;

    oneof msg {
        Text text = 10;
        KeyCombo key_combo = 11;
        Consumer consumer = 12;
        KeyboardReport keyboard_report = 13;
        Strokes strokes = 14;

        Ping ping = 30;
        GetConfig get_config = 31;
        SetConfig set_config = 32;

        OtaBegin ota_begin = 40;
        OtaData ota_data = 41;
        OtaEnd ota_end = 42;
        OtaAbort ota_abort = 43;
    }
}

// Typed with the dongle's current layout. May be split anywhere, even inside a UTF-8 sequence.
message Text {
    string text = 1;
}

// Keystrokes already translated by the phone, typed with the dongle's timing.
// Packed 3-byte entries: [modifiers, keycode, flags]. Each is pressed, then released.
// flags bit 0: the key is affected by Caps Lock; the dongle inverts Shift while the host has
// Caps Lock on, since only the dongle sees that state.
message Strokes {
    bytes strokes = 1;
}

// Pressed together, then released.
message KeyCombo {
    uint32 modifiers = 1;   // HID modifier bits
    bytes keys = 2;         // up to 6 HID keyboard usages
}

// Pressed, then released.
message Consumer {
    uint32 usage = 1;       // HID consumer page usage
}

// Sent as is. The phone is responsible for releasing keys with a later empty report.
message KeyboardReport {
    uint32 modifiers = 1;
    bytes keys = 2;
}

message GetConfig {}

// Only the fields present are changed. Replied to with a Config event.
message SetConfig {
    Config config = 1;
}

message Ping {}

// Firmware update: OtaBegin, then OtaData in order from offset 0, then OtaEnd. While an update
// is running, input requests fail with RESULT_FAILED. An update is abandoned if the session ends,
// on a CTRL abort, or with OtaAbort.
//
// OtaBegin erases the inactive app slot, so its Ack can take several seconds. After OtaEnd is
// acknowledged the dongle restarts into the new firmware, which falls back to the previous one
// if it fails to start.
message OtaBegin {
    uint32 size = 1;        // image size in bytes (the build's firmware.bin)
    bytes sha256 = 2;       // SHA-256 of the whole image, checked by OtaEnd
}

message OtaData {
    uint32 offset = 1;      // must equal the number of bytes sent so far
    bytes data = 2;
}

message OtaEnd {}

message OtaAbort {}

message Config {
    optional string layout = 1;
    optional uint32 key_press_ms = 2;
    optional uint32 key_release_ms = 3;
    repeated string available_layouts = 4;  // read only
}

message Event {
    oneof msg {
        Hello hello = 1;
        Credits credits = 2;
        Ack ack = 3;

        Status status = 10;

        Config config = 30;
    }
}

// First event of every session.
message Hello {
    uint32 protocol_version = 1;
    uint32 max_frame = 2;               // largest CMD frame payload the dongle accepts
    string firmware_version = 3;
    // Request families this firmware handles, e.g. "text", "strokes", "key_combo", "consumer",
    // "keyboard_report", "config", "ota".
    repeated string capabilities = 4;
}

message Credits {
    uint32 bytes = 1;
    bool reset = 2;
}

enum Result {
    RESULT_OK = 0;
    RESULT_INVALID = 1;     // malformed or unsupported request
    RESULT_FAILED = 2;      // valid request that could not be carried out
    RESULT_ABORTED = 3;
}

// Sent once the request has been handled. For input requests that means queued for typing.
message Ack {
    uint32 id = 1;
    Result result = 2;
}

message Status {
    bool typing = 1;
    bool usb_mounted = 2;
    string layout = 3;
}
