name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Build
        run: pio run -e release
      - name: Check version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(git describe --tags --always --dirty)
          [ "$version" = "$TAG" ] || { echo "version $version does not match tag $TAG"; exit 1; }
      - name: No eFuse-burning options
        run: tools/check_no_efuse.sh sdkconfig.release
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: |
            .pio/build/release/firmware.bin
            .pio/build/release/firmware.elf
            .pio/build/release/bootloader.bin
            .pio/build/release/partitions.bin
            .pio/build/release/ota_data_initial.bin
          if-no-files-found: error

  # Holds the signing key: waits for approval in the `release` environment, runs only pinned actions
  # and hash-pinned packages.
  sign:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: build
      - name: Install esptool
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --no-deps -r tools/requirements-sign.txt
      - name: Sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          TAG: ${{ github.ref_name }}
          PYTHON: ${{ runner.temp }}/venv/bin/python
        run: |
          key="$RUNNER_TEMP/signing-key.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          tools/sign_release.sh build "$key" tools/release-key.pub.pem dist "keyling-$TAG"
          cp build/firmware.elf "dist/keyling-$TAG.elf"
          cp build/ota_data_initial.bin "dist/keyling-$TAG-otadata.bin"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m espsecure digest-sbv2-public-key \
            --keyfile tools/release-key.pub.pem --output "$RUNNER_TEMP/signer.bin"
          signer=$(od -An -tx1 -v "$RUNNER_TEMP/signer.bin" | tr -d ' \n')
          prerelease=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
          gh release create "$TAG" dist/* --verify-tag --generate-notes $prerelease --notes "$(cat <<EOF
          - \`keyling-$TAG.bin\`: update over Bluetooth (hub app or \`tools/client.py ota\`).
          - \`keyling-$TAG-full.bin\`: new dongles, over USB at offset 0x0. Erases pairing, settings and all keys.
          - \`keyling-$TAG-otadata.bin\`: with \`keyling-$TAG.bin\`, for a dongle already in use, over USB
            (BOOT held). Keeps pairing, settings and keys, as long as its partition table is the same:
            \`esptool --chip esp32s3 write-flash 0xf000 keyling-$TAG-otadata.bin 0x20000 keyling-$TAG.bin\`
          - \`keyling-$TAG.elf\`: symbols for reading crash reports.

          Signed with the release key (SHA-256 \`$signer\`). Release firmware only accepts updates over
          Bluetooth that carry this signature; going back to a development build needs USB.
          EOF
          )"
