name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tools:
    name: Lint, type check, generated code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Protocol submodule
        run: git submodule update --init --depth 1 proto
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv tools/.venv
          tools/.venv/bin/pip install -r tools/requirements-dev.txt
      - name: Lint
        run: tools/.venv/bin/ruff check .
      - name: Type check
        run: tools/.venv/bin/pyright
      - name: Generated protocol code matches proto/
        run: |
          tools/.venv/bin/python tools/gen_proto.py
          git diff --exit-code -- components/protocol tools/bridge_pb2.py tools/bridge_pb2.pyi

  build:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        env: [hid, release]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: ./.github/actions/setup-build
      - name: Build
        run: pio run -e ${{ matrix.env }}
      - name: No eFuse-burning options
        run: tools/check_no_efuse.sh sdkconfig.${{ matrix.env }}

